<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Ágilex · Gasto Histórico Marketing</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f2f8;--card:#fff;--ink:#15163a;--muted:#6a6d8c;--line:#e6e4f0;--field:#f0f1f8;--primary:#0b4a7a;--bad:#c23b3b}
@media (prefers-color-scheme: dark){:root{--bg:#0f1024;--card:#181a36;--ink:#eceefe;--muted:#9a9ec2;--line:#2a2d55;--field:#21244a;--primary:#3f8fd0;--bad:#ef7b7b}}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Outfit',system-ui,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;display:grid;place-items:center;padding:16px}
.box{position:relative;overflow:hidden;background:var(--card);border-radius:16px;box-shadow:0 4px 24px rgba(21,22,58,.08);padding:40px 32px 32px;width:100%;max-width:400px;text-align:center}
.box::before{content:"";position:absolute;top:0;left:0;right:0;height:5px;background:linear-gradient(90deg,#3b2fc9 0 35%,#f0ad2e 35% 66%,#1e9bd7 66% 100%)}
.logo{font-weight:800;font-size:34px;font-style:italic;letter-spacing:-1px;color:#2a2a9e;margin-bottom:6px}
@media (prefers-color-scheme: dark){.logo{color:#a29dff}}
.logo span{color:#f0ad2e}
h1{font-size:18px;font-weight:600;margin-bottom:4px}
p{font-size:14px;color:var(--muted);margin-bottom:22px}
input[type=password]{width:100%;background:var(--field);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:12px 14px;font:inherit;font-size:15px;margin-bottom:12px}
input[type=password]:focus{outline:2px solid var(--primary);outline-offset:1px}
label{display:flex;gap:8px;align-items:center;justify-content:center;font-size:13px;color:var(--muted);margin-bottom:18px;cursor:pointer}
button{width:100%;background:var(--primary);color:#fff;border:0;border-radius:10px;padding:12px;font:inherit;font-size:15px;font-weight:600;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
.err{color:var(--bad);font-size:13px;min-height:18px;margin-top:12px}
</style>
</head>
<body>
<form class="box" id="f" autocomplete="off">
  <div class="logo">ÁGILE<span>X</span></div>
  <h1>Gasto histórico de marketing</h1>
  <p>Acceso restringido. Ingrese la clave para ver el tablero.</p>
  <input type="password" id="k" placeholder="Clave" autofocus required aria-label="Clave">
  <label><input type="checkbox" id="r"> Recordarme en este equipo</label>
  <button id="b" type="submit">Ingresar</button>
  <div class="err" id="e" role="alert"></div>
</form>

const u8=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const K="agx_hist_k";
async function abrir(raw){
  const key=await crypto.subtle.importKey("raw",raw,{name:"AES-GCM"},false,["decrypt"]);
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:u8(P.i)},key,u8(P.c));
  const html=new TextDecoder().decode(pt);
  document.open(); document.write(html); document.close();
}
async function derivar(clave){
  const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(clave),"PBKDF2",false,["deriveKey"]);
  const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:u8(P.s),iterations:P.n,hash:"SHA-256"},base,{name:"AES-GCM",length:256},true,["decrypt"]);
  return new Uint8Array(await crypto.subtle.exportKey("raw",key));
}
window.addEventListener("load",()=>setTimeout(async()=>{ let g=null; try{ g=localStorage.getItem(K); }catch(_){} if(!g) return; try{ await abrir(u8(g)); }catch(e){ console.warn("acceso recordado inválido",e); try{localStorage.removeItem(K)}catch(_){} } },0));
document.getElementById("f").addEventListener("submit",async ev=>{
  ev.preventDefault(); const b=document.getElementById("b"), e=document.getElementById("e");
  b.disabled=true; b.textContent="Verificando…"; e.textContent="";
  try{
    const raw=await derivar(document.getElementById("k").value);
    if(document.getElementById("r").checked){ try{ localStorage.setItem(K,btoa(String.fromCharCode(...raw))); }catch(_){} }
    await abrir(raw);
  }catch(err){ e.textContent="Clave incorrecta. Intente de nuevo."; b.disabled=false; b.textContent="Ingresar"; document.getElementById("k").select(); }
});
</script>
